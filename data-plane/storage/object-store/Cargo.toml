[package]
name = "object-store"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
sha2 = "0.10"
hex = "0.4"
hostname = "0.4"

[build-dependencies]
cmake = "0.1"
